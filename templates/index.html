<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>教学视频自动播放</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    margin: 0;
    background: #ffffff;
    color: #1f2937;
  }
  #overview { padding: 24px 40px; }
  #overview h2 { margin-top: 40px; border-top: 1px solid #e5e7eb; padding-top: 16px; }
  #stage {
    display: none;
    height: 100vh;
    box-sizing: border-box;
    padding: 48px;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #stage.active { display: flex; }
  #stage-content { width: 100%; }
  #start-btn {
    font-size: 20px;
    padding: 12px 28px;
    cursor: pointer;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
  }
  #start-btn:hover { background: #1d4ed8; }
  #status { margin-top: 16px; color: #555; }
  #lang-select {
    margin: 16px 0;
    font-size: 16px;
  }
  #lang-select label {
    margin-right: 20px;
    cursor: pointer;
  }
  #lang-select input { margin-right: 6px; }
  .mermaid { text-align: center; }
  #done-banner {
    font-size: 32px;
    text-align: center;
    color: #16a34a;
  }
  #caption {
    position: fixed;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%);
    max-width: 80%;
    padding: 12px 24px;
    background: rgba(0, 0, 0, 0.72);
    font-size: 28px;
    line-height: 1.5;
    text-align: center;
    border-radius: 8px;
    display: none;
  }
  #caption .caption-name {
    display: block;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  #caption.speaker-1 { border-left: 6px solid #f472b6; }
  #caption.speaker-1 .caption-name { color: #f472b6; }
  #caption.speaker-1 .caption-text { color: #ffe4ef; }

  #caption.speaker-2 { border-left: 6px solid #60a5fa; }
  #caption.speaker-2 .caption-name { color: #60a5fa; }
  #caption.speaker-2 .caption-text { color: #dbeafe; }
</style>
</head>
<body>

<div id="overview">
  <h1>素材一览(共 {{ slides_preview|length }} 组)</h1>
  <p>确认下面内容无误后,请把浏览器窗口<strong>最大化 / 按 F11 全屏</strong>,再点击"开始录制"。</p>

  <div id="lang-select">
    <strong>录制语言:</strong>
    {% for code, name in languages.items() %}
      <label>
        <input type="radio" name="lang" value="{{ code }}" {% if code == default_language %}checked{% endif %}>{{ name }}
      </label>
    {% endfor %}
  </div>

  <button id="start-btn">开始录制</button>
  <div id="status"></div>

  {% for slide in slides_preview %}
    <h2>第 {{ slide.index }} 组</h2>
    <div>{{ slide.html | safe }}</div>
  {% endfor %}
</div>

<div id="stage">
  <div id="stage-content"></div>
  <div id="caption"></div>
</div>

<script>
  mermaid.initialize({ startOnLoad: false, theme: "default" });
  const socket = io();

  function renderMermaidIn(el) {
    mermaid.run({ nodes: el.querySelectorAll(".mermaid") });
  }

  document.getElementById("start-btn").addEventListener("click", () => {
    const langInput = document.querySelector('input[name="lang"]:checked');
    const lang = langInput ? langInput.value : "{{ default_language }}";
    document.getElementById("status").innerText = "已开始录制,请勿关闭本窗口或切换到其他窗口...";
    document.getElementById("start-btn").disabled = true;
    fetch("/api/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lang: lang }),
    });
  });

  socket.on("show_slide", (data) => {
    document.getElementById("overview").style.display = "none";
    const stage = document.getElementById("stage");
    stage.classList.add("active");
    const content = document.getElementById("stage-content");
    content.innerHTML = data.html;
    renderMermaidIn(content);
    document.getElementById("caption").style.display = "none";
  });

  socket.on("show_caption", (data) => {
    const cap = document.getElementById("caption");
    if (!data.text) {
      cap.style.display = "none";
      return;
    }
    const isSpeaker2 = data.speaker === "2";
    cap.className = isSpeaker2 ? "speaker-2" : "speaker-1";
    cap.innerHTML =
      `<span class="caption-name">${data.label}</span>` +
      `<span class="caption-text">${data.text}</span>`;
    cap.style.display = "block";
  });

  socket.on("all_done", () => {
    const content = document.getElementById("stage-content");
    content.innerHTML = '<div id="done-banner">播放完毕</div>';
    document.getElementById("caption").style.display = "none";
  });
</script>

</body>
</html>
